<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لوحة Media hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#14212b;--mute:#62717d;--line:#e3e8ec;--brand:#0f6e6a;--brand2:#e6f3f2;--ok:#1e8a4c;--okbg:#e5f5ec;--bad:#c23b32;--badbg:#fbe9e7;--warn:#b26a00;--warnbg:#fdf2dc;--bar:#0f6e6a;--shadow:0 1px 2px rgba(16,24,32,.06),0 2px 8px rgba(16,24,32,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1417;--card:#152027;--ink:#e6edf0;--mute:#93a3ad;--line:#24323a;--brand:#4fc3b7;--brand2:#173431;--ok:#5ccf8d;--okbg:#16322a;--bad:#f07a70;--badbg:#3a1f1d;--warn:#f0b54d;--warnbg:#3a2e16;--bar:#4fc3b7;--shadow:none}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;padding-bottom:84px}
button,input,textarea,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:700;flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute);display:inline-block}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.icon{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 11px;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:14px 16px}
nav{position:fixed;bottom:0;inset-inline:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;padding:6px 2px;border-radius:10px;color:var(--mute);font-size:12px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:19px;font-weight:400;line-height:1}
nav button.on{color:var(--brand);background:var(--brand2)}
.badge{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;line-height:17px}
h2{font-size:16px;margin:22px 0 10px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.kpi .l{color:var(--mute);font-size:13px}.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{color:var(--mute);font-size:12px}
.kpi.hot{border-color:var(--bad)}.kpi.hot .v{color:var(--bad)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:18px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart .b{width:100%;max-width:26px;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.chart .n{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.chart .d{font-size:10px;color:var(--mute);margin-top:4px;white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.list .card{margin-bottom:10px}
.muted{color:var(--mute)}.small{font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.n{background:var(--brand2);color:var(--brand)}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.shot{width:100%;max-height:420px;object-fit:contain;border-radius:10px;background:var(--bg);margin-top:10px;display:block}
input[type=text],input[type=number],input[type=search],textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.sw{width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--ok)}.sw.on.danger{background:var(--bad)}.sw.on::after{inset-inline-start:23px}
.help{font-size:12.5px;color:var(--mute);margin:5px 2px 2px;line-height:1.7}
.sticky{position:sticky;bottom:80px;z-index:4;justify-content:center}.sticky .btn{box-shadow:0 4px 14px rgba(0,0,0,.25);padding:12px 28px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:start;padding:9px 6px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500;font-size:12px}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
.copy{display:flex;gap:6px;align-items:center;margin-top:6px}.copy code{flex:1;direction:ltr;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;overflow:auto;white-space:nowrap}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}.sheet .in{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
#toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:10;display:none;max-width:90vw}
.center{text-align:center;padding:60px 20px}
.health div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}.health div:last-child{border:0}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
</style>
</head>
<body>
<header><span class="dot" id="hdot" title="الحالة"></span><h1>لوحة Media hub saver</h1><button class="icon" id="refresh" aria-label="تحديث">↻</button></header>
<main id="app"><div class="center muted">جاري التحميل…</div></main>
<nav id="nav" hidden>
<button data-t="home" class="on"><b>◉</b>الرئيسية</button>
<button data-t="pay"><b>💳</b>الاشتراكات<span class="badge" id="pbadge" hidden></span></button>
<button data-t="users"><b>👥</b>المستخدمين</button>
<button data-t="ads"><b>📣</b>الإعلانات</button>
<button data-t="set"><b>⚙</b>الإعدادات</button>
</nav>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div id="toast"></div>
<script>
(()=>{
const BOT="BMEDIAHUB_BOT";
let T="";try{const h=new URLSearchParams(location.hash.slice(1)).get("t");if(h){localStorage.setItem("bmh_t",h);history.replaceState(null,"",location.pathname)}T=localStorage.getItem("bmh_t")||""}catch(e){const h=new URLSearchParams(location.hash.slice(1)).get("t");if(h)T=h}
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("ar-EG");
const dt=t=>t?new Date(t).toLocaleString("ar-EG",{timeZone:"Africa/Cairo",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}):"-";
const dd=t=>t?new Date(t).toLocaleDateString("ar-EG",{timeZone:"Africa/Cairo",day:"numeric",month:"short",year:"numeric"}):"-";
function toast(m){const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2600)}
async function api(op,body,raw){
  const r=await fetch("/api/panel/"+op,{method:body?"POST":"GET",headers:{authorization:"Bearer "+T,...(body?{"content-type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});
  if(r.status===401){locked();throw Error("auth")}
  if(raw)return r;
  const j=await r.json().catch(()=>({ok:false,error:"خطأ في الاتصال"}));if(!j.ok)throw Error(j.error||"خطأ");return j.data;
}
function locked(){try{localStorage.removeItem("bmh_t")}catch(e){}$("#nav").hidden=true;app.innerHTML='<div class="center"><h2>🔒 محتاج رابط دخول</h2><p class="muted">ابعت الأمر <b>/web</b> للبوت من حساب الأدمن، وافتح الرابط اللي هيبعتهولك.</p><a class="btn" href="https://t.me/'+BOT+'">افتح البوت</a></div>'}
if(!T){locked();return}
$("#nav").hidden=false;
let tab="home",chartKey="active",payFilter="pending",users=null,q="";
const tabs={home,pay,users:usersTab,ads,set:settings};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));render()});
$("#refresh").onclick=()=>{users=null;render()};
function render(){app.innerHTML='<div class="center muted">جاري التحميل…</div>';tabs[tab]().catch(e=>{if(e.message!=="auth")app.innerHTML='<div class="center"><p>⚠️ '+esc(e.message)+'</p><button class="btn ghost" onclick="location.reload()">إعادة المحاولة</button></div>'})}
function badge(n){const b=$("#pbadge");b.hidden=!n;b.textContent=n}

async function home(){
  const [o,h]=await Promise.all([api("overview",{}),api("health",{}).catch(()=>null)]);
  badge(o.pay.pending);
  const t=o.days.at(-1)||{},y=o.days.at(-2)||{};
  const allOk=h&&h.worker?.ok&&h.redisMs>=0;$("#hdot").className="dot "+(h?(allOk?"ok":"bad"):"");
  const K=(l,v,s,hot)=>'<div class="card kpi'+(hot?" hot":"")+'"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':"")+'</div>';
  const keys={active:"النشطين",new:"الجداد",reels:"الريلز",dl:"التحميلات"};
  const max=Math.max(1,...o.days.map(d=>d[chartKey]));
  app.innerHTML=
   (o.cfg.maint?'<div class="card" style="border-color:var(--bad);margin-bottom:10px">🔴 وضع الصيانة شغال: المستخدمين مش قادرين يحمّلوا.</div>':"")+
   '<div class="grid">'+
   K("💳 طلبات مستنية",fmt(o.pay.pending),o.pay.pending?"راجعها من الاشتراكات":"مفيش حاجة مستنية",o.pay.pending>0)+
   K("💎 مشتركين فعّالين",fmt(o.pro),"إيراد الشهر: "+fmt(o.month.revenue)+" ج")+
   K("👥 كل المستخدمين",fmt(o.users),"+"+fmt(t.new)+" النهاردة")+
   K("🔥 نشطين النهاردة",fmt(t.active),"امبارح: "+fmt(y.active))+
   K("🎬 ريلز النهاردة",fmt(t.reels),"الشهر: "+fmt(o.month.reels))+
   K("📥 تحميلات النهاردة",fmt(t.dl),"الشهر: "+fmt(o.month.dl))+
   K("✅ اشتراكات مقبولة",fmt(o.pay.approved),"مرفوضة: "+fmt(o.pay.rejected))+
   K("⚙️ الإطلاق",o.cfg.launch>Date.now()?"شغال":"مقفول",o.cfg.launch>Date.now()?"لحد "+dd(o.cfg.launch):"الريلز المجانية بعلامة")+
   '</div><h2>آخر 14 يوم</h2><div class="card"><div class="seg">'+Object.entries(keys).map(([k,l])=>'<button data-k="'+k+'" class="'+(k===chartKey?"on":"")+'">'+l+'</button>').join("")+'</div>'+
   '<div class="chart">'+o.days.map(d=>'<div class="c" title="'+d.d+'"><span class="n">'+(d[chartKey]||"")+'</span><div class="b" style="height:'+(d[chartKey]/max*100)+'%"></div><span class="d">'+d.d.slice(8)+'/'+d.d.slice(5,7)+'</span></div>').join("")+'</div></div>'+
   '<h2>حالة النظام</h2><div class="card health">'+(h?
     '<div><span>🖥 السيرفر (التحميل والريلز)</span><span>'+(h.worker?.ok?'<span class="pill ok">شغال · '+h.worker.ms+'ms</span>':'<span class="pill bad">واقف</span>')+'</span></div>'+
     '<div><span>🗄 قاعدة البيانات</span><span>'+(h.redisMs>=0?'<span class="pill ok">'+h.redisMs+'ms</span>':'<span class="pill bad">مش بترد</span>')+' <span class="muted small">'+esc(/duckdns/.test(h.redisHost)?"على سيرفرك":"Upstash")+'</span></span></div>'+
     '<div><span>🤖 البوت (تليجرام)</span><span>'+(h.hook?(h.hook.pending>20?'<span class="pill warn">رسايل متأخرة: '+h.hook.pending+'</span>':'<span class="pill ok">شغال</span>'):'<span class="pill warn">؟</span>')+'</span></div>'+
     (h.hook?.error&&Date.now()-h.hook.errorAt<3600e3?'<div class="small"><span class="muted">آخر خطأ</span><span>'+esc(h.hook.error)+'</span></div>':"")
   :'<span class="muted">مش قادر أجيب الحالة</span>')+'</div>';
  app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{chartKey=b.dataset.k;home()});
}

async function pay(){
  const list=await api("payments",{});badge(list.filter(x=>x.status==="pending").length);
  const shown=list.filter(x=>payFilter==="all"||x.status===payFilter);
  const S={pending:'<span class="pill warn">مستني مراجعة</span>',approved:'<span class="pill ok">مقبول</span>',rejected:'<span class="pill bad">مرفوض</span>'};
  app.innerHTML='<div class="seg">'+[["pending","مستنية"],["approved","مقبولة"],["rejected","مرفوضة"],["all","الكل"]].map(([k,l])=>'<button data-f="'+k+'" class="'+(k===payFilter?"on":"")+'">'+l+' ('+list.filter(x=>k==="all"||x.status===k).length+')</button>').join("")+'</div>'+
   '<div class="list">'+(shown.length?shown.map(x=>'<div class="card" data-id="'+x.id+'"><div class="row"><b>'+esc(x.name||"بدون اسم")+(x.uname?' <span class="muted small">@'+esc(x.uname)+'</span>':"")+'</b>'+S[x.status]+'</div>'+
     '<div class="small muted">📱 حوّل من: <b style="color:var(--ink);direction:ltr;display:inline-block">'+esc(x.phone)+'</b> · 🆔 '+esc(x.user)+' · '+dt(x.ts)+'</div>'+
     (x.status==="approved"?'<div class="small muted">الاشتراك لحد '+dd(x.exp)+(x.amount?' · '+esc(x.amount)+' ج':'')+'</div>':"")+
     (x.status==="pending"?'<img class="shot" alt="سكرين التحويل" data-rid="'+x.id+'"><div class="actions"><button class="btn ok" data-a="a">✅ قبول (30 يوم)</button><button class="btn bad" data-a="r">❌ رفض</button></div>':'<div class="actions"><button class="btn ghost" data-show>عرض السكرين</button></div>')+
     '</div>').join(""):'<div class="empty">'+(payFilter==="pending"?"🎉 مفيش طلبات مستنية":"مفيش طلبات")+'</div>')+'</div>';
  app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{payFilter=b.dataset.f;pay()});
  const load=async img=>{try{const r=await api("photo?rid="+img.dataset.rid,null,true);if(r.ok)img.src=URL.createObjectURL(await r.blob());else img.alt="السكرين مش متاح"}catch(e){}};
  app.querySelectorAll("img.shot").forEach(load);
  app.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{const c=b.closest(".card"),i=document.createElement("img");i.className="shot";i.dataset.rid=c.dataset.id;b.replaceWith(i);load(i)});
  app.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{
    const c=b.closest(".card"),a=b.dataset.a;
    if(!confirm(a==="a"?"اتأكدت إن الفلوس وصلت؟ هيتفعّل الاشتراك 30 يوم.":"رفض الطلب؟ المستخدم هيوصله إشعار."))return;
    c.querySelectorAll("button").forEach(x=>x.disabled=true);
    try{const r=await api("decide",{rid:c.dataset.id,act:a});toast(r.note);pay()}catch(e){toast("⚠️ "+e.message);c.querySelectorAll("button").forEach(x=>x.disabled=false)}
  });
}

async function usersTab(){
  if(!users)users=await api("users",{});
  const draw=()=>{
    const s=q.trim().toLowerCase(),f=s?users.filter(u=>u.id.includes(s)||u.name.toLowerCase().includes(s)||u.uname.toLowerCase().includes(s.replace(/^@/,""))||u.src===s||(s==="pro"&&u.pro)||(s==="banned"&&u.ban)):users;
    $("#ulist").innerHTML=f.slice(0,200).map(u=>'<div class="card" data-u="'+u.id+'" style="cursor:pointer"><div class="row"><b>'+esc(u.name||"بدون اسم")+(u.uname?' <span class="muted small">@'+esc(u.uname)+'</span>':"")+'</b><span>'+(u.pro?'<span class="pill ok">مشترك</span> ':"")+(u.ban?'<span class="pill bad">محظور</span> ':"")+(u.src?'<span class="pill n">'+esc(u.src)+'</span>':"")+'</span></div><div class="small muted">🆔 '+u.id+' · سجّل '+dd(u.reg)+(u.pro?' · مشترك لحد '+dd(u.pexp):"")+'</div></div>').join("")||'<div class="empty">مفيش نتايج</div>';
    $("#ucount").textContent=fmt(f.length)+" مستخدم"+(f.length>200?" (أول 200)":"");
    app.querySelectorAll("[data-u]").forEach(c=>c.onclick=()=>userSheet(users.find(u=>u.id===c.dataset.u)));
  };
  app.innerHTML='<input type="search" id="uq" placeholder="دوّر بالاسم أو @يوزر أو الـ ID… (أو اكتب pro / banned)" value="'+esc(q)+'"><div class="small muted" id="ucount" style="margin:8px 2px"></div><div class="list" id="ulist"></div>';
  $("#uq").oninput=e=>{q=e.target.value;draw()};draw();
}
function userSheet(u){
  const sh=$("#sheet"),inn=$("#sheetIn");
  inn.innerHTML='<div class="row"><h2 style="margin:0">'+esc(u.name||"بدون اسم")+'</h2><button class="icon" id="cls">✕</button></div>'+
   '<p class="small muted">'+(u.uname?'<a href="https://t.me/'+esc(u.uname)+'" target="_blank">@'+esc(u.uname)+'</a> · ':"")+'🆔 '+u.id+' · سجّل '+dd(u.reg)+(u.src?' · جه من '+esc(u.src):"")+'</p>'+
   '<p>'+(u.pro?'<span class="pill ok">مشترك لحد '+dd(u.pexp)+'</span> ':'<span class="pill n">مجاني</span> ')+(u.ban?'<span class="pill bad">محظور</span> ':"")+(u.nowm?'<span class="pill n">بدون علامة مائية</span> ':"")+(u.unl?'<span class="pill n">غير محدود</span>':"")+'</p>'+
   '<label>تفعيل / تمديد الباقة المميزة (أيام)</label><div class="copy"><input type="number" id="pd" value="30" min="1" max="366"><button class="btn ok" data-x="pro">تفعيل</button></div>'+
   '<label>إضافة تحميلات مجانية</label><div class="copy"><input type="number" id="gn" value="5" min="1" max="1000"><button class="btn" data-x="grant">إضافة</button></div>'+
   '<label>رسالة للمستخدم ده</label><textarea id="um" placeholder="اكتب الرسالة…"></textarea><div class="actions"><button class="btn" data-x="msg">إرسال</button></div>'+
   '<div class="actions" style="margin-top:18px">'+(u.pro?'<button class="btn ghost" data-x="unpro">إلغاء الباقة</button>':"")+'<button class="btn ghost" data-x="nowm">'+(u.nowm?"رجّع العلامة المائية":"شيل العلامة المائية")+'</button><button class="btn ghost" data-x="unl">'+(u.unl?"إلغاء غير محدود":"تحميل غير محدود")+'</button><button class="btn '+(u.ban?"ok":"bad")+'" data-x="'+(u.ban?"unban":"ban")+'">'+(u.ban?"فك الحظر":"حظر")+'</button></div>';
  sh.classList.add("on");
  const close=()=>sh.classList.remove("on");$("#cls").onclick=close;sh.onclick=e=>{if(e.target===sh)close()};
  inn.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{
    const act=b.dataset.x,body={uid:u.id,act};
    if(act==="pro")body.days=$("#pd").value;if(act==="grant")body.n=$("#gn").value;if(act==="msg")body.text=$("#um").value;
    if(act==="ban"&&!confirm("حظر المستخدم ده؟"))return;
    b.disabled=true;
    try{await api("user",body);toast("✅ تم");if(act==="msg"){$("#um").value="";b.disabled=false;return}users=null;close();usersTab()}catch(e){toast("⚠️ "+e.message);b.disabled=false}
  });
}

  const s=await api("sources",{});
  const link=c=>"https://t.me/"+BOT+"?start="+c;
  app.innerHTML='<h2 style="margin-top:4px">نتايج روابط الإعلانات</h2><div class="card">'+(s.length?'<table><thead><tr><th>الكود</th><th class="num">دخلوا</th><th class="num">اشتركوا</th><th class="num">التحويل</th></tr></thead><tbody>'+
    s.map(x=>'<tr><td><b>'+esc(x.src)+'</b></td><td class="num">'+fmt(x.visits)+'</td><td class="num">'+fmt(x.paid)+'</td><td class="num">'+(x.visits?(x.paid/x.visits*100).toFixed(1)+"%":"-")+'</td></tr>').join("")+'</tbody></table>'
    :'<div class="empty">لسه مفيش حد دخل من رابط إعلان</div>')+'</div>'+
   '<p class="small muted">«direct» = اشتركوا من غير ما ييجوا من رابط إعلان.</p>'+
   '<h2>اعمل رابط لإعلان جديد</h2><div class="card"><label>كود الإعلان (حروف إنجليزي وأرقام، مثلاً fb1 أو ig_reels2)</label><input type="text" id="code" value="fb1" dir="ltr" maxlength="27"><div id="links"></div></div>';
  const draw=()=>{const c=($("#code").value||"").toLowerCase().replace(/[^a-z0-9_]/g,"");$("#links").innerHTML=c?[["الرابط العادي",c],["يفتح الاشتراك على طول",c+"_sub"],["يفتح صانع الريلز على طول",c+"_reel"]].map(([l,v])=>'<label>'+l+'</label><div class="copy"><code>'+link(v)+'</code><button class="btn ghost" data-c="'+link(v)+'">نسخ</button></div>').join(""):"";
    $("#links").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.c).then(()=>toast("اتنسخ ✅"),()=>toast(b.dataset.c))})};
  $("#code").oninput=draw;draw();
  app.insertAdjacentHTML("afterbegin",'<h2 style="margin-top:4px">📈 صفحة الهبوط</h2><div class="seg" id="lpd"><button data-d="1">النهارده</button><button data-d="7" class="on">7 أيام</button><button data-d="30">30 يوم</button></div><div id="lpa"><div class="card muted">جاري التحميل…</div></div>');
  app.querySelectorAll("#lpd button").forEach(b=>b.onclick=()=>{app.querySelectorAll("#lpd button").forEach(x=>x.classList.toggle("on",x===b));lpBlock(+b.dataset.d)});
  lpBlock(7);
}
const LPF=[["view","زاروا الصفحة"],["t15","فضلوا 15 ثانية"],["t30","فضلوا 30 ثانية"],["sec:how","وصلوا «بيشتغل إزاي»"],["sec:proof","وصلوا للنتايج"],["sec:price","وصلوا للأسعار"],["sec:faq","وصلوا للأسئلة"],["click","داسوا زرار البوت"],["lead","دخلوا البوت فعلًا"],["buy","اشتركوا"]];
const LPG=s=>/^fb_new/.test(s)?"B · يبدأ صفحة":/^fb_pro/.test(s)?"A · صناع محتوى":/^fb_all/.test(s)?"ALL · شرح عام":"مباشر / تاني";
async function lpBlock(days){
  const box=$("#lpa");if(!box)return;
  let d;try{d=await api("lpstats",{days})}catch(e){box.innerHTML='<div class="card">⚠️ '+esc(e.message)+'</div>';return}
  if(!d.rows.length){box.innerHTML='<div class="card"><div class="empty">لسه مفيش زيارات للصفحة في الفترة دي</div></div>';return}
  const add=(a,r)=>{for(const k in r)if(k!=="src")a[k]=(a[k]||0)+r[k];return a};
  const groups={};d.rows.forEach(r=>{const g=LPG(r.src);groups[g]=add(groups[g]||{},r)});
  const all=d.rows.reduce((a,r)=>add(a,r),{});
  const pc=(x,v)=>v?Math.round((x||0)/v*100):0;
  const funnel=(t,g)=>{const v=g.view||0;return '<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>'+esc(t)+'</b><span class="muted small">'+fmt(v)+' زيارة</span></div>'+
    LPF.map(([k,l])=>{const n=k==="click"?(g.click||0)+(g.click_pro||0):(g[k]||0),p=pc(n,v);return '<div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>'+l+'</span><span><b>'+fmt(n)+'</b> <span class="muted">· '+p+'%</span></span></div><div style="height:7px;border-radius:4px;background:var(--line);margin-top:3px;overflow:hidden"><div style="height:100%;width:'+Math.min(100,p)+'%;background:var(--brand);border-radius:4px"></div></div></div>'}).join("")+'</div>'};
  const max=Math.max(1,...d.daily.map(x=>x.views));
  const spark='<div class="card" style="margin-bottom:10px"><b>الزيارات يوم بيوم</b><div style="display:flex;direction:ltr;align-items:flex-end;gap:3px;height:70px;margin-top:10px">'+d.daily.map(x=>'<div title="'+x.day+': '+x.views+'" style="flex:1;background:var(--brand);opacity:.85;border-radius:3px 3px 0 0;height:'+Math.max(2,x.views/max*100)+'%"></div>').join("")+'</div><div class="small muted" style="display:flex;justify-content:space-between;direction:ltr"><span>'+d.daily[0].day.slice(5)+'</span><span>'+d.daily[d.daily.length-1].day.slice(5)+'</span></div></div>';
  const table='<div class="card"><b>كل كود لوحده</b><table style="margin-top:8px"><thead><tr><th>الكود</th><th class="num">زيارات</th><th class="num">فضلوا 30ث</th><th class="num">الأسعار</th><th class="num">الزرار</th><th class="num">البوت</th><th class="num">اشتركوا</th></tr></thead><tbody>'+
    d.rows.map(r=>{const v=r.view||0;return '<tr><td><b>'+esc(r.src)+'</b></td><td class="num">'+fmt(v)+'</td><td class="num">'+pc(r.t30,v)+'%</td><td class="num">'+pc(r["sec:price"],v)+'%</td><td class="num">'+pc((r.click||0)+(r.click_pro||0),v)+'%</td><td class="num">'+fmt(r.lead||0)+'</td><td class="num">'+fmt(r.buy||0)+'</td></tr>'}).join("")+'</tbody></table></div>';
  box.innerHTML=spark+funnel("كل الصفحات",all)+Object.entries(groups).sort((a,b)=>(b[1].view||0)-(a[1].view||0)).map(([g,v])=>funnel(g,v)).join("")+table+
    '<p class="small muted">النِسَب من عدد الزيارات. «دخلوا البوت» = داسوا Start بعد ما جم من الصفحة.</p>';
}

async function settings(){
  const {cfg:c}=await api("settings",{});
  // F(key,label,value,help,type,placeholder)
  const F=(k,l,v,h,t,ph)=>'<label for="s_'+k+'">'+l+'</label><input type="'+(t||"text")+'" id="s_'+k+'" value="'+esc(v)+'" '+(ph?'placeholder="'+ph+'"':"")+(t==="number"||k==="paynum"?' dir="ltr"':"")+'><div class="help">'+h+'</div>';
  const T=(k,l,on,h,danger)=>'<div class="toggle"><div><b>'+l+'</b><div class="help" style="margin:2px 0 0">'+h+'</div></div><button class="sw '+(on?"on":"")+(danger?" danger":"")+'" data-sw="'+k+'" aria-label="'+esc(l)+'"></button></div>';
  const launchLeft=c.launch>Date.now()?Math.ceil((c.launch-Date.now())/864e5):0;
  const warnCap=c.freecap>0&&c.freecap<50;
  app.innerHTML=
   '<div class="card">'+T("maint","🔴 وضع الصيانة",c.maint,"بيوقف التحميل وعمل الريلز لكل المستخدمين (غير الأدمن). استخدمه وقت مشكلة في السيرفر بس.",true)+'</div>'+
   '<h2>💎 الباقة المدفوعة</h2><div class="card">'+
     F("price","سعر الاشتراك الشهري (جنيه)",c.price,"المبلغ اللي البوت بيطلبه من المشترك، وبيظهر في /plans وفي رسالة الدفع.","number")+
     F("p_daily","عدد الريلز في اليوم للمشترك",c.pDaily,"كل مشترك يقدر يعمل كام ريل في اليوم (الريلز الجاهزة بتتحسب منهم).","number")+
     F("p_cap","أقصى مدة للريل (ثانية)",c.pCap,"أطول ريل المشترك يقدر يطلبه. 180 = 3 دقايق.","number")+
     T("pack","⚡ زرار «ريلز جاهزة»",c.packOn,"المشترك يدوس مرة واحدة في اليوم وياخد 3 أو 5 ريلز جاهزة للنشر (آيات وقرّاء وخلفيات مختلفة).")+
     F("pack_max","أقصى عدد للريلز الجاهزة (3 أو 5)",c.packMax,"لو 3 = يظهر اختيار 3 بس. لو 5 = المشترك يختار 3 أو 5.","number")+
     '<div class="help">💡 المشترك دايمًا: جودة 1080، ومن غير علامة مائية، وأولوية في الطابور.</div></div>'+
   '<h2>🆓 المجاني</h2><div class="card">'+
     F("f_daily","عدد الريلز في اليوم لكل مستخدم مجاني",c.fDaily,"كل مستخدم مجاني يقدر يعمل كام ريل في اليوم. (1 = ريل واحد لكل واحد)","number")+
     F("f_cap","أقصى مدة للريل المجاني (ثانية)",c.fCap,"60 = دقيقة. لو أطول، المجاني مش هيحس بفرق الاشتراك.","number")+
     T("f_hd","جودة 1080 للمجاني",c.fHd,"مقفولة = المجاني بيطلع 720 (أسرع وأخف على السيرفر)، والـ 1080 ميزة للمشترك.")+
     F("launchDays","فترة الإطلاق (أيام)",launchLeft,"طول الفترة دي الريلز المجانية بتطلع <b>من غير علامة مائية</b> كهدية. 0 = إيقاف."+(launchLeft?" (شغالة دلوقتي لحد "+dd(c.launch)+")":""),"number")+
     F("freecap","الحد الإجمالي للريلز المجانية في اليوم (لكل البوت)",c.freecap,"<b>مجموع</b> الريلز المجانية لكل المستخدمين مع بعض في اليوم، عشان ضغط المجاني ميأخرش المشتركين. لما يخلص، المجاني يستنى لبكرة. 0 = من غير حد. المقترح وقت الإعلانات: 300."+(warnCap?'<br><b style="color:var(--bad)">⚠️ القيمة دي صغيرة جدًا: بعد '+c.freecap+' ريل في اليوم كل المستخدمين المجانيين هيتقفل عليهم.</b>':""),"number")+
   '</div>'+
   '<h2>📣 القناة الإجبارية</h2><div class="card">'+
     F("chan_days","القناة الإجبارية للمجاني تبدأ بعد كام يوم",c.chanDays,"<b>-1 = مقفولة</b> (أي حد يجرّب البوت من غير ما يشترك في القناة). 0 = من أول استخدام. 3 = المستخدم المجاني يستخدم البوت 3 أيام براحته، وبعدها يُطلب منه الاشتراك في القناة. المشتركين في الباقة عمرهم ما بيتطلب منهم.","number")+
   '</div>'+
   '<h2>📥 تحميل الفيديوهات المجاني</h2><div class="card">'+
     F("welcome","هدية البداية (تحميلات)",c.welcome,"عدد التحميلات اللي المستخدم الجديد بياخدها أول ما يسجّل، يستخدمها في أي وقت.","number")+
     F("daily","الحد اليومي (تحميلات)",c.daily,"بعد ما الهدية تخلص: كام تحميل في اليوم لكل مستخدم.","number")+
     F("bonus","مكافأة الاشتراك في قناة (تحميلات)",c.bonus,"لما الحد اليومي يخلص ويشترك في قناة من قنوات المكافأة، بياخد العدد ده زيادة لباقي اليوم.","number")+
   '</div>'+
   '<h2>💳 الدفع</h2><div class="card">'+
     F("paynum","رقم فودافون كاش",c.paynum,"الرقم اللي المشترك بيحوّل عليه، وبيظهر له في خطوات الاشتراك.","text","01xxxxxxxxx")+
     F("payinsta","InstaPay (اختياري)",c.payinsta,"لو كتبته، بيظهر كطريقة دفع تانية.","text","name@instapay")+
     F("contact","حساب الدعم (اختياري)",c.contact,"بيظهر للمستخدم لو طلبه اترفض أو عنده مشكلة.","text","@support")+
   '</div>'+
   '<div class="actions sticky"><button class="btn" id="save">💾 حفظ الإعدادات</button></div>'+
   '<h2>📣 رسالة لكل المستخدمين</h2><div class="card"><textarea id="bc" placeholder="الرسالة اللي هتتبعت لكل مستخدمين البوت…"></textarea><div class="actions"><button class="btn" id="send">إرسال للكل</button></div><div class="small muted" id="bcs"></div></div>'+
   '<h2>🔒 الأمان</h2><div class="card small muted">رابط الدخول ده صالح 30 يوم. لو اتسرّب: ابعت للبوت <b>/web off</b> وكل الروابط القديمة هتتقفل، وبعدها <b>/web</b> لرابط جديد.<div class="actions"><button class="btn ghost" id="out">تسجيل خروج من الجهاز ده</button></div></div>';
  const sw={maint:c.maint,pack:c.packOn,f_hd:c.fHd};
  app.querySelectorAll("[data-sw]").forEach(b=>b.onclick=async()=>{const k=b.dataset.sw,on=!sw[k];
    if(k==="maint"&&on&&!confirm("تشغيل الصيانة؟ التحميل والريلز هيقفوا للكل."))return;
    try{await api("settings",{set:{[k]:on}});sw[k]=on;b.classList.toggle("on",on);toast("✅ اتحفظ")}catch(x){toast("⚠️ "+x.message)}});
  $("#save").onclick=async e=>{const set={};["price","p_daily","p_cap","pack_max","f_daily","f_cap","chan_days","launchDays","freecap","welcome","daily","bonus","paynum","payinsta","contact"].forEach(k=>{const v=$("#s_"+k).value.trim();if(k==="paynum"&&!v)return;set[k]=v});
    e.target.disabled=true;try{await api("settings",{set});toast("✅ اتحفظ");settings()}catch(x){toast("⚠️ "+x.message);e.target.disabled=false}};
  $("#send").onclick=async e=>{const text=$("#bc").value.trim();if(!text)return toast("اكتب الرسالة الأول");if(!confirm("هتتبعت لكل المستخدمين. متأكد؟"))return;
    e.target.disabled=true;let from=0,ok=0,fail=0;
    try{do{const r=await api("broadcast",{text,from});ok+=r.ok;fail+=r.fail;from=r.next;$("#bcs").textContent="اتبعت "+fmt(ok)+" · فشل "+fmt(fail)+(from?" · مكمّل…":" · خلصت ✅")}while(from)}catch(x){toast("⚠️ "+x.message)}e.target.disabled=false};
  $("#out").onclick=()=>{try{localStorage.removeItem("bmh_t")}catch(e){}locked()};
}
render();
})();
</script>
